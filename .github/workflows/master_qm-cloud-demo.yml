# Docs for the Azure Web Apps Deploy action: https://go.microsoft.com/fwlink/?linkid=2134798
# More GitHub Actions for Azure: https://go.microsoft.com/fwlink/?linkid=2135048

name: Azure App Service - qm-cloud-demo(Production), Build and deploy Python app

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # checkout the repo
    - name: 'Checkout Github Action'
      uses: actions/checkout@v4

    - name: Set up Python version
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Kein lokaler Oryx-Build (appservice-build) nötig: App Service baut remote
    # (App Settings: SCM_DO_BUILD_DURING_DEPLOYMENT=true, ENABLE_ORYX_BUILD=true)
    - name: Validate dependencies
      run: pip install -r requirements.txt

    - name: Run Azure webapp deploy action using publish profile credentials
      uses: azure/webapps-deploy@v3
      with:
        app-name: qm-cloud-demo
        slot-name: Production
        package: .
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B884C06620BF41B9B0151D9003B70980 }}

